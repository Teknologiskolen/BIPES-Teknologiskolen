# Rate limiting for auth endpoints
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# Rate limiting for the unauthenticated OTA fetch. The token is 192-bit/single-use so
# guessing is already infeasible; this just bounds abusive hammering of the endpoint.
limit_req_zone $binary_remote_addr zone=ota:10m rate=30r/m;

# Don't advertise the exact nginx version in the Server header or on error pages.
server_tokens off;

# HTTP server - redirect to HTTPS (except ACME challenges)
server {
    listen 80;
    server_name _;

    # Resolve the web container at request time (Docker DNS) so a rebuilt web
    # container (new IP) doesn't leave nginx pinned to a stale IP -> 502.
    resolver 127.0.0.11 valid=10s;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # OTA program fetch for devices over plain HTTP (token-gated, single-use, 180s TTL).
    # Microcontrollers fetch here to avoid TLS overhead; everything else is redirected to
    # HTTPS. NOTE: on a public cloud VM port 80 is internet-reachable, so this is NOT
    # LAN-only — security rests on the 192-bit single-use token (delivered over the
    # authenticated MQTT-over-TLS link) plus the rate limit below. The token + program
    # body still cross this leg in cleartext; for stronger guarantees serve it over HTTPS
    # or sign the payload. If it really is LAN-only, restrict source CIDRs at the firewall.
    location /api/devices/ota/ {
        limit_req zone=ota burst=10 nodelay;
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # Resolve the web container at request time so a rebuilt web container doesn't
    # leave nginx pinned to a stale IP -> 502 (the recurring "502 Bad Gateway").
    resolver 127.0.0.11 valid=10s;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size
    client_max_body_size 10m;

    # Rate-limited auth endpoints
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic static files - proxy to Flask
    location ~ ^/static/(style\.css|libs/bipes\.umd\.js|page/.*/toolbox\.umd\.js|page/blocks/blocks\.umd\.js|page/blocks/pythonic\.umd\.js)$ {
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve regular static files directly from nginx, and let browsers CACHE them.
    # The previous no-store made every IDE load re-fetch every asset — brutal on a
    # 1-core box and the 1 TB/mo transfer cap. The version-busted bundles (?v=...)
    # invalidate on deploy; a 1 h window bounds staleness for the rest. For a bigger
    # offload (CPU + bandwidth), put a CDN in front of /static/.
    location /static/ {
        alias /usr/share/nginx/html/static/;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # IDE page - disable caching to prevent stale user data
    location = /ide {
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent browser from caching authenticated pages
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    # Login/register pages - also disable caching
    location ~ ^/(login|register)$ {
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    # Read-only blocks embed — must be framable by EXTERNAL lesson sites. This location
    # deliberately omits X-Frame-Options (SAMEORIGIN would block cross-origin framing);
    # the page's own CSP `frame-ancestors *` (from Flask) is the framing control. Having
    # any add_header here means nginx does NOT inherit the server-level X-Frame-Options.
    location /embed {
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # NOTE: no X-Frame-Options on purpose.
    }

    # Proxy everything else to Flask
    location / {
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # MQTT API endpoints (Flask)
    location /mqtt {
        set $bipes_web http://web:5000;
        proxy_pass $bipes_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MQTT WebSocket proxy (browser -> wss:// -> nginx -> ws://broker:9001)
    # Uses runtime DNS resolution so nginx doesn't crash if broker isn't ready
    location /wss {
        resolver 127.0.0.11 valid=10s;
        set $mqtt_upstream http://broker:9001;
        proxy_pass $mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
