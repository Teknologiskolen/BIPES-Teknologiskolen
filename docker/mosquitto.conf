# Mosquitto configuration for BIPES

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Security - password file authentication
allow_anonymous false
password_file /mosquitto/config/mosquitto_passwd

# MQTT listener
listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets
