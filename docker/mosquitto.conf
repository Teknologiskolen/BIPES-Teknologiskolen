# Mosquitto configuration for BIPES

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging — stdout only (Docker captures + rotates it; an in-container file log
# would grow unbounded on the 15 GB disk). "all" logs every connect/sub/pub, which
# is heavy CPU + noise at scale; keep just the levels that matter operationally.
log_dest stdout
log_type error
log_type warning
log_type notice

# Security - Mosquitto Dynamic Security plugin
per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Plain MQTT listener — INTERNAL ONLY (the docker network: the Flask subscriber and the
# websockets bridge). It is NOT published to the host, so it never reaches the internet.
listener 1883
protocol mqtt

# TLS MQTT listener — this is what physical devices (Pico W) connect to over the
# internet, so their per-device credentials and telemetry are encrypted in transit.
# Reuses the same cert/key nginx serves (mounted read-only at /mosquitto/certs). On the
# cloud VM these become your real (e.g. Let's Encrypt) cert so devices can also VERIFY
# the broker; with the dev self-signed cert the device encrypts without verifying.
listener 8883
protocol mqtt
certfile /mosquitto/certs/cert.pem
keyfile /mosquitto/certs/key.pem

# WebSocket listener — browsers reach this via nginx (wss on 443 -> ws 9001 internally),
# so it also stays internal-only.
listener 9001
protocol websockets
