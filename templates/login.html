<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.login }} - BIPES</title>
    <link rel="stylesheet" href="/static/auth/style.css">
</head>
<body class="login-page {{ theme }}">
    <div class="auth-container">
        <div class="auth-header">
            <img class="auth-logo" src="/static/media/icon/icon-192x192.png" alt="BIPES logo">
            <h1 id="login-title">{{ t.login }}</h1>
            <p id="login-subtitle">{{ t.login_subtitle }}</p>
        </div>

        <div id="alert-container"></div>

        <!-- Teacher Login -->
        <div id="teacher-login" style="display: none;">
            <form id="teacher-login-form" class="auth-form">
                <div class="form-group">
                    <label for="teacher-email">{{ t.email }}</label>
                    <input type="email" id="teacher-email" name="email" required placeholder="teacher@school.com">
                </div>

                <div class="form-group">
                    <label for="teacher-password">{{ t.password }}</label>
                    <input type="password" id="teacher-password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">{{ t.login_as_teacher }}</span>
                </button>
            </form>

            <div class="auth-links">
                <p>{{ t.register_prompt }} <a href="/register" data-auth-preserve>{{ t.register_here }}</a></p>
                <p><a href="/ide" data-auth-ide>{{ t.guest_login }}</a></p>
            </div>
        </div>

        <!-- Student Login -->
        <div id="student-login" style="display: none;">
            <form id="student-class-form" class="auth-form">
                <div class="form-group">
                    <label for="class-code">{{ t.class_code }}</label>
                    <input
                        type="text"
                        id="class-code"
                        name="class_code"
                        required
                        placeholder="ABC123XY"
                        maxlength="8"
                        style="text-transform: uppercase;">
                </div>

                <div class="form-group">
                    <label for="student-name">{{ t.username }}</label>
                    <input type="text" id="student-name" name="student_name" required placeholder="{{ t.username }}">
                </div>

                <div class="form-group">
                    <label for="student-password-class">{{ t.password }}</label>
                    <input type="password" id="student-password-class" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">{{ t.login }}</span>
                </button>
            </form>

            <div class="auth-links">
                <p><a href="/ide" data-auth-ide>{{ t.guest_login }}</a></p>
            </div>
        </div>

        <div class="auth-back">
            <a href="/" class="btn btn-secondary" data-auth-preserve>{{ t.back_home }}</a>
        </div>
    </div>

    <div id="status-bar" class="auth-status-bar">
        <div id="extra">
            <button id="forum" class="status-icon" type="button" title="{{ t.forum }}">{{ t.forum }}</button>
            <button id="theme" class="status-icon" type="button" title="{{ t.change_theme }}">{{ t.mode }}</button>
            <span id="language" class="status-icon">{{ t.language }}
                <select id="auth-language" title="{{ t.language }}">
                    {% for key, value in available_lang.items() -%}
                    <option value="{{ key }}">{{ value }}</option>
                    {% endfor %}
                </select>
            </span>
        </div>
        <div id="globals"></div>
    </div>
    <script>window.authText = {{ t|tojson }};</script>
    <script src="/static/auth/preferences.js"></script>
    <script src="/static/auth/login.js"></script>
</body>
</html>
