<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BIPES</title>
    <link rel="stylesheet" href="/static/auth/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1 id="login-title">Login</h1>
            <p id="login-subtitle">Access your BIPES account</p>
        </div>

        <div id="alert-container"></div>

        <!-- Teacher Login -->
        <div id="teacher-login" style="display: none;">
            <form id="teacher-login-form" class="auth-form">
                <div class="form-group">
                    <label for="teacher-email">Email</label>
                    <input type="email" id="teacher-email" name="email" required placeholder="teacher@school.com">
                </div>

                <div class="form-group">
                    <label for="teacher-password">Password</label>
                    <input type="password" id="teacher-password" name="password" required placeholder="••••••••">
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="teacher-remember" name="remember">
                    <label for="teacher-remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Login as Teacher</span>
                </button>
            </form>

            <div class="auth-links">
                <p>Don't have an account? <a href="/register">Register here</a></p>
                <p><a href="/ide">Continue as Guest</a></p>
            </div>
        </div>

        <!-- Student Login -->
        <div id="student-login" style="display: none;">
            <div class="tabs">
                <button class="tab active" data-tab="class-code-tab">Class Code</button>
                <button class="tab" data-tab="email-tab">Email</button>
            </div>

            <!-- Class Code Login Tab -->
            <div id="class-code-tab" class="tab-content active">
                <form id="student-class-form" class="auth-form">
                    <div class="form-group">
                        <label for="class-code">Class Code</label>
                        <input
                            type="text"
                            id="class-code"
                            name="class_code"
                            required
                            placeholder="ABC123XY"
                            maxlength="8"
                            style="text-transform: uppercase;">
                    </div>

                    <div class="form-group">
                        <label for="student-name">Your Name</label>
                        <input type="text" id="student-name" name="student_name" required placeholder="John Smith">
                    </div>

                    <div class="form-group">
                        <label for="student-password-class">Password</label>
                        <input type="password" id="student-password-class" name="password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Login</span>
                    </button>
                </form>
            </div>

            <!-- Email Login Tab -->
            <div id="email-tab" class="tab-content">
                <form id="student-email-form" class="auth-form">
                    <div class="form-group">
                        <label for="student-email">Email</label>
                        <input type="email" id="student-email" name="email" required placeholder="student@email.com">
                    </div>

                    <div class="form-group">
                        <label for="student-password-email">Password</label>
                        <input type="password" id="student-password-email" name="password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Login</span>
                    </button>
                </form>
            </div>

            <div class="auth-links">
                <p><a href="/ide">Continue as Guest</a></p>
            </div>
        </div>

        <div class="auth-back">
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <script src="/static/auth/login.js"></script>
</body>
</html>
