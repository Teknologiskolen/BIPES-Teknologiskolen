<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BIPES</title>
    <link rel="stylesheet" href="/static/auth/style.css">
    <script src="/static/base/csrf.js?v={{ app_version }}"></script>
</head>
<body class="login-page {{ theme }}" data-i18n-doctitle="login">
    <div class="auth-container">
        <div class="auth-header">
            <img class="auth-logo" src="/static/media/icon/icon-192x192.png" alt="BIPES logo">
            <h1 id="login-title" data-i18n="login">Login</h1>
            <p id="login-subtitle" data-i18n="login_subtitle">Access your BIPES account</p>
        </div>

        <div id="alert-container"></div>

        <!-- Teacher Login -->
        <div id="teacher-login" style="display: none;">
            <form id="teacher-login-form" class="auth-form">
                <div class="form-group">
                    <label for="teacher-email" data-i18n="email">Email</label>
                    <input type="email" id="teacher-email" name="email" required placeholder="teacher@school.com">
                </div>

                <div class="form-group">
                    <label for="teacher-password" data-i18n="password">Password</label>
                    <input type="password" id="teacher-password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text" data-i18n="login_as_teacher">Login as Teacher</span>
                </button>
            </form>

            <div class="auth-links">
                <p><a href="/ide" data-auth-ide data-i18n="guest_login">Continue as Guest</a></p>
            </div>
        </div>

        <!-- Student Login -->
        <div id="student-login" style="display: none;">
            <form id="student-class-form" class="auth-form">
                <div class="form-group">
                    <label for="class-code" data-i18n="class_code">Class Code</label>
                    <input
                        type="text"
                        id="class-code"
                        name="class_code"
                        required
                        placeholder="ABC123XY"
                        maxlength="8"
                        style="text-transform: uppercase;">
                </div>

                <div class="form-group">
                    <label for="student-name" data-i18n="username">Username</label>
                    <input type="text" id="student-name" name="student_name" required placeholder="Username" data-i18n-placeholder="username">
                </div>

                <div class="form-group">
                    <label for="student-password-class" data-i18n="password">Password</label>
                    <input type="password" id="student-password-class" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text" data-i18n="login">Login</span>
                </button>
            </form>

            <div class="auth-links">
                <p><a href="/ide" data-auth-ide data-i18n="guest_login">Continue as Guest</a></p>
            </div>
        </div>

        <div class="auth-back">
            <a href="/" class="btn btn-secondary" data-auth-preserve data-i18n="back_home">Back to Home</a>
        </div>
    </div>

    <div id="status-bar" class="auth-status-bar">
        <div id="extra">
            <button id="forum" class="status-icon" type="button" title="Forum" data-i18n="forum" data-i18n-title="forum">Forum</button>
            <button id="theme" class="status-icon" type="button" title="Change theme" data-i18n="mode" data-i18n-title="change_theme">Mode</button>
            <span id="language" class="status-icon"><span data-i18n="language">Language</span>
                <select id="auth-language" title="Language" data-i18n-title="language">
                    {% for key, value in available_lang.items() -%}
                    <option value="{{ key }}">{{ value }}</option>
                    {% endfor %}
                </select>
            </span>
        </div>
        <div id="globals"></div>
    </div>
    <script>window.Blockly = window.Blockly || { Msg: {} };</script>
    <script src="/static/msg/{{ lang }}.js"></script>
    <script src="/static/auth/preferences.js"></script>
    <script src="/static/auth/login.js"></script>
</body>
</html>
