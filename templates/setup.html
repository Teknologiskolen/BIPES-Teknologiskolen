<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.setup_title }} - BIPES</title>
    <link rel="stylesheet" href="/static/auth/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>{{ t.setup_title }}</h1>
            <p>{{ t.setup_subtitle }}</p>
        </div>

        <div id="alert-container"></div>

        <div class="alert alert-info">
            <strong>{{ t.setup_info_label }}</strong> {{ t.setup_info }}
        </div>

        <form id="setup-form" class="auth-form">
            <div class="form-group">
                <label for="current-password">{{ t.current_password }}</label>
                <input type="password" id="current-password" name="current_password" required placeholder="{{ t.current_password_placeholder }}">
            </div>

            <div class="form-group">
                <label for="new-password">{{ t.new_password }} <span style="color: red;">*</span></label>
                <input type="password" id="new-password" name="new_password" required placeholder="{{ t.new_password_placeholder }}" minlength="8">
                <div id="password-strength" class="password-strength"></div>
                <small style="color: #666; font-size: 0.85rem;">{{ t.minimum_password }}</small>
            </div>

            <div class="form-group">
                <label for="confirm-password">{{ t.confirm_new_password }} <span style="color: red;">*</span></label>
                <input type="password" id="confirm-password" name="confirm_password" required placeholder="{{ t.confirm_new_password_placeholder }}">
            </div>

            <button type="submit" class="btn btn-primary">
                <span class="btn-text">{{ t.complete_setup }}</span>
            </button>
        </form>

        <div class="auth-links">
            <p><small>{{ t.required_fields }}</small></p>
        </div>
    </div>

    <script>window.authText = {{ t|tojson }};</script>
    <script src="/static/auth/preferences.js"></script>
    <script src="/static/auth/setup.js"></script>
</body>
</html>
