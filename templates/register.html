<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BIPES</title>
    <link rel="stylesheet" href="/static/auth/style.css">
</head>
<body>
    <a href="/" class="back-link">← Back to Home</a>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Teacher Registration</h1>
            <p>Create your teacher account to manage classes</p>
        </div>

        <div id="alert-container"></div>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full_name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="teacher@school.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
                <div id="password-strength" class="password-strength"></div>
                <small style="color: #666; font-size: 0.85rem;">Minimum 8 characters</small>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password" required placeholder="••••••••">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the <a href="#" style="color: #667eea;">Terms of Service</a></label>
            </div>

            <button type="submit" class="btn btn-primary">
                <span class="btn-text">Create Account</span>
            </button>
        </form>

        <div class="auth-links">
            <p>Already have an account? <a href="/login/teacher">Login here</a></p>
        </div>
    </div>

    <script src="/static/auth/register.js"></script>
</body>
</html>
