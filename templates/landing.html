<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIPES - Block based Integrated Platform for Embedded Systems</title>
    <link rel="stylesheet" href="/static/auth/style.css">
</head>
<body class="landing-page">
    <div class="landing-container">
        <div class="landing-header">
            <h1>Welcome to BIPES</h1>
            <p class="subtitle">Block based Integrated Platform for Embedded Systems</p>
        </div>

        <div class="landing-content">
            <div class="login-options">
                <a href="/login/teacher" class="login-option teacher-option">
                    <div class="option-icon">👨‍🏫</div>
                    <h2>Teacher Login</h2>
                    <p>Manage classes and view student projects</p>
                </a>

                <a href="/login/student" class="login-option student-option">
                    <div class="option-icon">👨‍🎓</div>
                    <h2>Student Login</h2>
                    <p>Access your projects from any device</p>
                </a>

                <a href="/ide" class="login-option guest-option">
                    <div class="option-icon">🚀</div>
                    <h2>Continue as Guest</h2>
                    <p>Start coding without an account</p>
                </a>
            </div>

            <div class="landing-footer">
                <p>Don't have a teacher account? <a href="/register">Register here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
