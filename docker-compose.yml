# Cap container log files so they can't fill the small (15 GB) disk. Applied to each
# long-running service via the *default-logging alias below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database — always on (the system only runs in full auth mode).
  # On the production VM, start via ./deploy.sh or `make deploy-prod` (both add
  # docker-compose.prod.yml for the mem/cpu limits). A bare `docker compose up -d`
  # loads docker-compose.override.yml (dev watch, NO resource limits) — do NOT use
  # it on the 2 GB VM.
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    logging: *default-logging
    # Sized for a small all-in-one VM (2 GB shared with web + broker + nginx). The web
    # tier only opens a handful of connections (2 gthread workers x ~8 threads + the
    # MQTT subscriber), so 50 is ample, and a low cap protects RAM (each connection
    # can cost several MB). shared_buffers kept modest so Postgres doesn't crowd out
    # the web workers. Raise these if Postgres moves to its own box.
    command:
      ["postgres",
       "-c", "max_connections=50",
       "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bipes}
      POSTGRES_USER: ${POSTGRES_USER:-bipes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - bipes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bipes_user} -d ${POSTGRES_DB:-bipes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mosquitto MQTT Broker
  mosquitto-dynsec-init:
    image: eclipse-mosquitto:2.0
    container_name: broker_dynsec_init
    restart: "no"
    environment:
      - MOSQUITTO_DYNSEC_ADMIN_USERNAME=${MOSQUITTO_DYNSEC_ADMIN_USERNAME:-admin}
      - MOSQUITTO_DYNSEC_ADMIN_PASSWORD=${MOSQUITTO_DYNSEC_ADMIN_PASSWORD:?Set MOSQUITTO_DYNSEC_ADMIN_PASSWORD in .env}
    volumes:
      - mosquitto_data:/mosquitto/data
    command: >
      sh -c 'if [ ! -f /mosquitto/data/dynamic-security.json ]; then
        printf "%s\n%s\n" "$$MOSQUITTO_DYNSEC_ADMIN_PASSWORD" "$$MOSQUITTO_DYNSEC_ADMIN_PASSWORD" |
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json "$$MOSQUITTO_DYNSEC_ADMIN_USERNAME";
      fi'
    networks:
      - bipes_network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: broker
    restart: always
    logging: *default-logging
    # Publish ONLY the TLS listener to the host. The plaintext 1883 + websockets 9001
    # listeners stay on the internal docker network (Flask subscriber + nginx wss), so
    # the only internet-reachable MQTT port is encrypted. (Was "1884:1883" — that put
    # plaintext device credentials on a host port; removed.)
    ports:
      - "8883:8883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker/ssl:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    depends_on:
      mosquitto-dynsec-init:
        condition: service_completed_successfully
    networks:
      - bipes_network

  # Flask Application with Gunicorn
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: bipes_web
    restart: always
    logging: *default-logging
    environment:
      - FLASK_ENV=production
      # Always full auth + Postgres — there is no guest/sqlite startup path.
      - AUTH_MODE=full
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-bipes}
      - POSTGRES_USER=${POSTGRES_USER:-bipes_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - MOSQUITTO_HOST=broker
      - MOSQUITTO_PORT=1883
      - MOSQUITTO_USERNAME=${MOSQUITTO_USERNAME:-bipes-server}
      - MOSQUITTO_PASSWORD=${MOSQUITTO_PASSWORD:?Set MOSQUITTO_PASSWORD in .env}
      - MOSQUITTO_DYNSEC_ENABLED=${MOSQUITTO_DYNSEC_ENABLED:-true}
      - MOSQUITTO_DYNSEC_ADMIN_USERNAME=${MOSQUITTO_DYNSEC_ADMIN_USERNAME:-admin}
      - MOSQUITTO_DYNSEC_ADMIN_PASSWORD=${MOSQUITTO_DYNSEC_ADMIN_PASSWORD:?Set MOSQUITTO_DYNSEC_ADMIN_PASSWORD in .env}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:?Set PASSWORD_PEPPER in .env}
    volumes:
      - web_logs:/app/logs
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - bipes_network
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx Reverse Proxy with HTTPS
  nginx:
    image: nginx:alpine
    container_name: bipes_nginx
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    networks:
      - bipes_network

networks:
  bipes_network:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_logs:
  web_logs:
  nginx_logs:
