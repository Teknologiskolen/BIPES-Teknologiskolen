services:
  # PostgreSQL Database (only needed in full auth mode)
  # Start with: docker compose --profile auth up -d
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    profiles: ["auth"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bipes}
      POSTGRES_USER: ${POSTGRES_USER:-bipes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - bipes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bipes_user} -d ${POSTGRES_DB:-bipes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: broker
    restart: always
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker/mosquitto_passwd:/mosquitto/config/mosquitto_passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - bipes_network

  # Flask Application with Gunicorn
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: bipes_web
    restart: always
    environment:
      - FLASK_ENV=production
      - AUTH_MODE=${AUTH_MODE:-full}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-bipes}
      - POSTGRES_USER=${POSTGRES_USER:-bipes_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - MOSQUITTO_HOST=broker
      - MOSQUITTO_PASSWORD=${MOSQUITTO_PASSWORD:-changeme}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
    volumes:
      - web_logs:/app/logs
    depends_on:
      mosquitto:
        condition: service_started
    networks:
      - bipes_network
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx Reverse Proxy with HTTPS
  nginx:
    image: nginx:alpine
    container_name: bipes_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    networks:
      - bipes_network

networks:
  bipes_network:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_logs:
  web_logs:
  nginx_logs:
